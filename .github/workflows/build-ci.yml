name: Build CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build and package theme
        run: npm run package

      - name: Upload theme package
        uses: actions/upload-artifact@v7
        with:
          name: komari-theme-1999-${{ github.sha }}
          path: komari-theme-v*.zip
          if-no-files-found: error
          compression-level: 0
